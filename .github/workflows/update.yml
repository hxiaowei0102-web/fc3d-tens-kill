name: 十位杀一码 云端全自动更新

on:
  schedule:
    # 三重 cron 备份：北京 22:00 / 23:30 / 01:00 = UTC 14:00 / 15:30 / 17:00
    # 开奖 21:15 之后才执行，绝不提前预测；3次机会兜底，一次成功即止
    - cron: '0 14 * * *'
    - cron: '30 15 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: '强制重算并重新部署（忽略缓存）'
        required: false
        default: 'false'
        type: boolean

# 并发保护：三重 cron 若撞车，取消旧运行，只保留最新一次
concurrency:
  group: fc3d-tens-kill-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖(numpy)
        run: pip install "numpy>=1.26,<3"

      - name: 运行云端更新脚本(多源降级抓取+跨源校验+追加CSV+穷举+回测+生成页面)
        run: |
          if [ "${{ inputs.force_deploy }}" == "true" ]; then
            python update.py --cloud --force || exit 1
          else
            python update.py --cloud || exit 1
          fi

      - name: 检查是否有真实更新
        id: check
        run: |
          if [ "${{ inputs.force_deploy }}" == "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "force_deploy=true: 强制重算部署"
          elif git diff --quiet data/fc3d-history.csv && git diff --quiet cache/pool.json && git diff --quiet cache/result.json && git diff --quiet index.html; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "无新数据/无池变化/无页面变化，跳过提交"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "检测到真实更新(CSV/专家池/页面)"
          fi

      - name: 提交更新
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/ cache/ index.html || true
          git commit -m "自动更新$(TZ='Asia/Shanghai' date +%m%d) [skip ci]" || true
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "推送成功"
              break
            fi
            echo "第${i}次推送失败，3秒后重试"
            sleep 3
          done

      # 部署步骤不设条件：每次 cron 都重新部署一次当前 index.html。
      # 兜底效果：若某次部署失败（网络/Pages 瞬时故障），下次 cron 会自动补部署，
      # 不会出现"数据已提交但页面永远卡旧"的静默故障。
      - name: 准备部署文件
        run: |
          mkdir -p _site
          cp index.html _site/

      - name: 配置Pages
        uses: actions/configure-pages@v5

      - name: 上传部署产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: 部署到GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
